[package]
name = "lana-khora"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Throwaway spike: Lana's point-cloud avatar viz rendered on KhoraEngine instead of Bevy. Proves a custom WGSL PointList pipeline can be driven from an external EngineApp without editing Khora."
publish = false

[dependencies]
khora-sdk = { git = "https://github.com/eraflo/KhoraEngine", branch = "dev" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"

[[bin]]
name = "lana-khora"
path = "src/main.rs"
